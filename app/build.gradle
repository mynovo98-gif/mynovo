plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mynovo.mynovo1'
    compileSdk 35

    // [แก้] ให้ตรงกับ NDK ที่ติดตั้งในเครื่อง (r27d)
    ndkVersion "27.3.13750724"

    defaultConfig {
        applicationId "com.mynovo.mynovo1"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // [เพิ่ม] สร้างเฉพาะสถาปัตยกรรมของมือถือ (เครื่องส่วนใหญ่ปัจจุบันคือ arm64)
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // [เพิ่ม] ให้ Gradle คอมไพล์โฟลเดอร์ cpp (native-lib, uinput_driver, kbgrab)
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        // [เพิ่ม] แตกไฟล์ .so ลงโฟลเดอร์ lib จริง เพื่อให้ activate.sh คัดลอก libkbgrab.so ได้
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/versions/**',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

// กัน BouncyCastle รุ่นเก่า (jdk15to18) ที่ไลบรารีอื่นดึงมา ซ้อนกับ jdk18on
configurations.all {
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15to18'
    exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15to18'
    exclude group: 'org.bouncycastle', module: 'bcutil-jdk15to18'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'

    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcutil-jdk18on:1.78.1'
}